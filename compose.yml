---
services:
  gcloud_datastore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:592.0.0-emulators@sha256:c3b114528245d315af73d92d95d8e2fed9747ce29003ad46232f22b4542da036
    init: true
    security_opt:
      - no-new-privileges:true
    tty: true
    entrypoint: ["/start.sh"]
    volumes:
      - /opt/data
      - type: bind
        source: ./gcp/datastore/start.sh
        target: /start.sh
        read_only: true
      - type: bind
        source: ./gcp/datastore/healthcheck.sh
        target: /healthcheck.sh
        read_only: true
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      retries: 20
    environment:
      DATASTORE_PROJECT_ID: app
      DATASTORE_LISTEN_ADDRESS: 0.0.0.0:${GCLOUD_DATASOURCE_PORT}
      GCLOUD_DATASOURCE_PORT: ${GCLOUD_DATASOURCE_PORT}
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    environment:
      PROJECT_ID: app
      DATASTORE_EMULATOR_HOST: "gcloud_datastore:${GCLOUD_DATASOURCE_PORT}"
      PORT: ${PORT}
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    environment:
      PORT: ${PORT}
      FRONTEND_PORT: ${FRONTEND_PORT}
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:${FRONTEND_PORT}"
